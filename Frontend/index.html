<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Kakarcholi Village | Smart Village Management Portal
    </title>

    <meta
      name="description"
      content="Official Smart Village Management portal for Kakarcholi village. Explore village information, government schemes, public services, notices, events, emergency contacts, jobs, businesses and important places."
    />

    <meta
      name="keywords"
      content="Kakarcholi, Kakarcholi village, Kakarcholi Jharkhand, Smart Village Management, village portal, village services, government schemes, gram panchayat, village notices, emergency contacts, village jobs, village businesses"
    />

    <meta
      name="author"
      content="Smart Village Management"
    />

    <!-- Search Engine Crawling -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0f172a"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://smart-village-management.vercel.app/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.ico"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Kakarcholi Village | Smart Village Management Portal"
    />

    <meta
      property="og:description"
      content="Explore Kakarcholi village information, government schemes, services, notices, events, emergency contacts and important local resources."
    />

    <meta
      property="og:url"
      content="https://smart-village-management.vercel.app/"
    />

    <meta
      property="og:site_name"
      content="Smart Village Management"
    />

    <meta
      property="og:image"
      content="https://smart-village-management.vercel.app/village-hero-bg.webp"
    />

    <meta
      property="og:image:alt"
      content="Kakarcholi Village - Smart Village Management"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Kakarcholi Village | Smart Village Management Portal"
    />

    <meta
      name="twitter:description"
      content="Official village portal for Kakarcholi with village information, services, government schemes, notices, events and emergency contacts."
    />

    <meta
      name="twitter:image"
      content="https://smart-village-management.vercel.app/village-hero-bg.webp"
    />

    <meta
      name="twitter:image:alt"
      content="Kakarcholi Village - Smart Village Management"
    />

    <!-- Performance -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- React Application -->
    <div id="root"></div>

    <!-- React Entry -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
