<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      Kakarcholi Village | Smart Village Management Portal
    </title>

    <meta
      name="description"
      content="Official Smart Village Management portal for Kakarcholi village. Explore village information, government schemes, public services, notices, events, emergency contacts, jobs, businesses and important places."
    />

    <meta
      name="keywords"
      content="Kakarcholi, Kakarcholi village, Kakarcholi Jharkhand, Smart Village Management, village portal, village services, government schemes, gram panchayat, village notices, emergency contacts, village jobs, village businesses"
    />

    <meta
      name="author"
      content="Smart Village Management"
    />

    <!-- Search Engine Crawling -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0f172a"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://smart-village-management.vercel.app/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon.ico"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.ico"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Kakarcholi Village | Smart Village Management Portal"
    />

    <meta
      property="og:description"
      content="Explore Kakarcholi village information, government schemes, services, notices, events, emergency contacts and important local resources."
    />

    <meta
      property="og:url"
      content="https://smart-village-management.vercel.app/"
    />

    <meta
      property="og:site_name"
      content="Smart Village Management"
    />

    <meta
      property="og:image"
      content="https://smart-village-management.vercel.app/village-hero-bg.webp"
    />

    <meta
      property="og:image:alt"
      content="Kakarcholi Village - Smart Village Management"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Kakarcholi Village | Smart Village Management Portal"
    />

    <meta
      name="twitter:description"
      content="Official village portal for Kakarcholi with village information, services, government schemes, notices, events and emergency contacts."
    />

    <meta
      name="twitter:image"
      content="https://smart-village-management.vercel.app/village-hero-bg.webp"
    />

    <meta
      name="twitter:image:alt"
      content="Kakarcholi Village - Smart Village Management"
    />

    <!-- Performance -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Google Font (non-blocking: page font ka wait nahi karta) -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- Hero image pehle se download shuru -->
    <link
      rel="preload"
      as="image"
      href="/village-hero-bg.webp"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Structured data (JS ke bina bhi Google ko dikhta hai) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://smart-village-management.vercel.app/#website",
            "url": "https://smart-village-management.vercel.app/",
            "name": "Kakarcholi Village Portal",
            "alternateName": ["Kakarcholi", "Smart Village Management"],
            "inLanguage": "en-IN"
          },
          {
            "@type": "Place",
            "@id": "https://smart-village-management.vercel.app/#place",
            "name": "Kakarcholi",
            "description": "Kakarcholi village, Jharkhand, India - official village portal with services, notices, events, jobs and local businesses.",
            "url": "https://smart-village-management.vercel.app/",
            "address": {
              "@type": "PostalAddress",
              "addressRegion": "Jharkhand",
              "addressCountry": "IN"
            }
          }
        ]
      }
    </script>
  </head>

  <body>
    <!-- React Application -->
    <div id="root">
      <main style="font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:48px 20px;color:#0f172a">
        <h1 style="font-size:28px;margin:0 0 12px">Kakarcholi Village - Official Village Portal</h1>
        <p style="line-height:1.6;margin:0 0 16px">
          Village information, government schemes, public services, notices, events,
          emergency contacts, jobs and local businesses of Kakarcholi, Jharkhand.
        </p>
        <nav>
          <a href="/about">About Village</a> &middot;
          <a href="/services">Services</a> &middot;
          <a href="/notices">Notices</a> &middot;
          <a href="/events">Events</a> &middot;
          <a href="/jobs">Jobs</a> &middot;
          <a href="/businesses">Businesses</a> &middot;
          <a href="/emergency">Emergency</a> &middot;
          <a href="/contact">Contact</a>
        </nav>
      </main>
    </div>

    <!-- React Entry -->
    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
